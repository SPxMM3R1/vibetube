apply plugin: 'com.android.application'

// Firma de publicación: el workflow de GitHub restaura el keystore desde el secreto
// VIBETUBE_KEYSTORE_BASE64 y deja su ruta en VIBETUBE_KEYSTORE_PATH. Sin esa variable (en el
// computador de desarrollo) se usa la firma debug de siempre, y el APK compila igual que antes.
def ciKeystorePath = System.getenv('VIBETUBE_KEYSTORE_PATH')
def ciSigned = ciKeystorePath != null && !ciKeystorePath.trim().isEmpty()

android {
    namespace 'cl.vibe.tube'
    compileSdkVersion 34

    signingConfigs {
        if (ciSigned) {
            ci {
                storeFile file(ciKeystorePath)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'cl.vibe.tube'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 5
        versionName '0.4.1'
        multiDexEnabled true
        // El núcleo trae sabores (stbeta, ststable, stfdroid): usamos el estable.
        missingDimensionStrategy 'default', 'ststable'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            if (ciSigned) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            signingConfig ciSigned ? signingConfigs.ci : signingConfigs.debug
        }
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    implementation project(':mediaserviceinterfaces')
    implementation project(':youtubeapi')
    implementation project(':sharedutils')

    implementation 'io.reactivex.rxjava2:rxandroid:' + rxAndroidVersion
    implementation 'io.reactivex.rxjava2:rxjava:' + rxJavaVersion

    // Reproductor: el mismo Media3 que VibeM3U (la versión más nueva que acepta AGP 7 / compileSdk 34).
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"

    // FileProvider del actualizador: entrega el APK descargado al instalador de Android.
    implementation 'androidx.core:core:1.12.0'

    // Pruebas JVM de la lógica pura (calidades y manifiestos).
    testImplementation 'junit:junit:4.13.2'
}
